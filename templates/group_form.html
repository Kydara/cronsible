{{define "group_form"}}
<div class="card" style="max-width:640px;">
  <h2>{{if .SelectedGroup}}Edit Group{{else}}New Group{{end}}</h2>
  <form method="post" action="{{if .SelectedGroup}}/groups/update{{else}}/groups/create{{end}}">
    {{if .SelectedGroup}}<input type="hidden" name="id" value="{{.SelectedGroup.ID}}">{{end}}
    <div class="form-row">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{if .SelectedGroup}}{{.SelectedGroup.Name}}{{end}}" required>
    </div>
    <div class="form-row">
      <label for="description">Description</label>
      <input type="text" name="description" id="description" value="{{if .SelectedGroup}}{{.SelectedGroup.Description}}{{end}}">
    </div>
    <div class="actions">
      <button type="submit">Save</button>
      <a class="btn secondary" href="/groups">Cancel</a>
    </div>
  </form>
</div>
{{end}}
