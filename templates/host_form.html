{{define "host_form"}}
<div class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
  <h2 class="text-xl font-semibold">{{if .SelectedHost}}Edit Host{{else}}New Host{{end}}</h2>
  <form method="post" action="{{if .SelectedHost}}/hosts/update{{else}}/hosts/create{{end}}" class="mt-6 space-y-4">
    {{if .SelectedHost}}<input type="hidden" name="id" value="{{.SelectedHost.ID}}">{{end}}
    <div>
      <label for="name" class="block text-sm font-semibold text-slate-700">Name</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="name" id="name" value="{{if .SelectedHost}}{{.SelectedHost.Name}}{{end}}" required>
    </div>
    <div>
      <label for="address" class="block text-sm font-semibold text-slate-700">Address</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="address" id="address" value="{{if .SelectedHost}}{{.SelectedHost.Address}}{{end}}" required>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label for="user" class="block text-sm font-semibold text-slate-700">SSH User</label>
        <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="user" id="user" value="{{if .SelectedHost}}{{.SelectedHost.User}}{{end}}" required>
      </div>
      <div>
        <label for="port" class="block text-sm font-semibold text-slate-700">SSH Port</label>
        <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="port" id="port" value="{{if .SelectedHost}}{{.SelectedHost.Port}}{{else}}22{{end}}">
      </div>
    </div>
    <div>
      <label for="groups" class="block text-sm font-semibold text-slate-700">Groups</label>
      <select class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" name="group_ids" id="groups" multiple size="5">
        {{range .Groups}}
        <option value="{{.ID}}" {{if index $.SelectedGroupIDs .ID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
      <p class="mt-2 text-xs text-slate-500">Hold Ctrl/Cmd to select multiple groups.</p>
    </div>
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">Save</button>
      <a class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" href="/hosts">Cancel</a>
    </div>
  </form>
</div>
{{end}}
