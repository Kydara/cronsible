{{define "host_form"}}
<div class="card" style="max-width:720px;">
  <h2>{{if .SelectedHost}}Edit Host{{else}}New Host{{end}}</h2>
  <form method="post" action="{{if .SelectedHost}}/hosts/update{{else}}/hosts/create{{end}}">
    {{if .SelectedHost}}<input type="hidden" name="id" value="{{.SelectedHost.ID}}">{{end}}
    <div class="form-row">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{if .SelectedHost}}{{.SelectedHost.Name}}{{end}}" required>
    </div>
    <div class="form-row">
      <label for="address">Address</label>
      <input type="text" name="address" id="address" value="{{if .SelectedHost}}{{.SelectedHost.Address}}{{end}}" required>
    </div>
    <div class="grid">
      <div class="form-row">
        <label for="user">SSH User</label>
        <input type="text" name="user" id="user" value="{{if .SelectedHost}}{{.SelectedHost.User}}{{end}}" required>
      </div>
      <div class="form-row">
        <label for="port">SSH Port</label>
        <input type="text" name="port" id="port" value="{{if .SelectedHost}}{{.SelectedHost.Port}}{{else}}22{{end}}">
      </div>
    </div>
    <div class="form-row">
      <label for="groups">Groups</label>
      <select name="group_ids" id="groups" multiple size="5">
        {{range .Groups}}
        <option value="{{.ID}}" {{if index $.SelectedGroupIDs .ID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
      <div class="muted" style="font-size:12px;">Hold Ctrl/Cmd to select multiple groups.</div>
    </div>
    <div class="actions">
      <button type="submit">Save</button>
      <a class="btn secondary" href="/hosts">Cancel</a>
    </div>
  </form>
</div>
{{end}}
