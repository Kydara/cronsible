{{define "host_form"}}
<div class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
  <h2 class="text-xl font-semibold">{{if .SelectedHost}}Edit Host{{else}}New Host{{end}}</h2>
  <form method="post" action="{{if .SelectedHost}}/hosts/update{{else}}/hosts/create{{end}}" class="mt-6 space-y-4">
    {{if .SelectedHost}}<input type="hidden" name="id" value="{{.SelectedHost.ID}}">{{end}}
    <div>
      <label for="name" class="block text-sm font-semibold text-slate-700">Name</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="name" id="name" value="{{if .SelectedHost}}{{.SelectedHost.Name}}{{end}}" required>
    </div>
    <div>
      <label for="address" class="block text-sm font-semibold text-slate-700">Address</label>
      <div class="mt-2 flex gap-2">
        <input class="w-full flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="address" id="address" value="{{if .SelectedHost}}{{.SelectedHost.Address}}{{end}}" required>
        <button type="button" class="inline-flex items-center whitespace-nowrap rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" data-scan-host-key>Scan key</button>
      </div>
      <p id="scan_status" class="mt-2 text-xs text-slate-500"></p>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label for="user" class="block text-sm font-semibold text-slate-700">SSH User</label>
        <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="user" id="user" value="{{if .SelectedHost}}{{.SelectedHost.User}}{{end}}" required>
      </div>
      <div>
        <label for="port" class="block text-sm font-semibold text-slate-700">SSH Port</label>
        <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="port" id="port" value="{{if .SelectedHost}}{{.SelectedHost.Port}}{{else}}22{{end}}">
      </div>
    </div>
    <div>
      <label for="groups" class="block text-sm font-semibold text-slate-700">Groups</label>
      <select class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" name="group_ids" id="groups" multiple size="5">
        {{range .Groups}}
        <option value="{{.ID}}" {{if index $.SelectedGroupIDs .ID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
      <p class="mt-2 text-xs text-slate-500">Hold Ctrl/Cmd to select multiple groups.</p>
    </div>
    <div>
      <label for="host_key" class="block text-sm font-semibold text-slate-700">Host Key</label>
      <textarea class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-mono text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" name="host_key" id="host_key" rows="3" placeholder="example.com ssh-ed25519 AAAAC3Nza...">{{if .SelectedHost}}{{.SelectedHost.HostKey}}{{end}}</textarea>
      <p class="mt-2 text-xs text-slate-500">Paste the host's public key line from known_hosts to enable strict checking.</p>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="strict_host_checking" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" {{if .SelectedHost}}{{if .SelectedHost.StrictHostChecking}}checked{{end}}{{end}}>
      <label class="text-sm font-semibold text-slate-700">Strict host key checking</label>
    </div>
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">Save</button>
      <a class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" href="/hosts">Cancel</a>
    </div>
  </form>
</div>
<script>
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-scan-host-key]');
    if (!button) return;
    var address = document.getElementById('address');
    var port = document.getElementById('port');
    var hostKey = document.getElementById('host_key');
    var status = document.getElementById('scan_status');
    if (!address || !hostKey || !status) return;
    var value = address.value.trim();
    if (!value) {
      status.textContent = 'Enter an address to scan.';
      status.classList.remove('text-emerald-600');
      status.classList.add('text-rose-600');
      return;
    }
    button.disabled = true;
    button.classList.add('opacity-60', 'cursor-wait');
    status.textContent = 'Scanning...';
    status.classList.remove('text-rose-600');
    status.classList.remove('text-emerald-600');

    var payload = new URLSearchParams();
    payload.set('address', value);
    if (port && port.value.trim()) {
      payload.set('port', port.value.trim());
    }

    fetch('/hosts/scan-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { ok: res.ok, data: data };
        });
      })
      .then(function (result) {
        if (result.ok && result.data && result.data.key) {
          hostKey.value = result.data.key;
          status.textContent = 'Host key loaded.';
          status.classList.remove('text-rose-600');
          status.classList.add('text-emerald-600');
        } else {
          status.textContent = 'Scan failed.';
          status.classList.remove('text-emerald-600');
          status.classList.add('text-rose-600');
        }
      })
      .catch(function () {
        status.textContent = 'Scan failed.';
        status.classList.remove('text-emerald-600');
        status.classList.add('text-rose-600');
      })
      .finally(function () {
        button.disabled = false;
        button.classList.remove('opacity-60', 'cursor-wait');
      });
  });
</script>
{{end}}
