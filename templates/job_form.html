{{define "job_form"}}
<div class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
  <h2 class="text-xl font-semibold">{{if .SelectedJob}}Edit Job{{else}}New Job{{end}}</h2>
  <form method="post" action="{{if .SelectedJob}}/jobs/update{{else}}/jobs/create{{end}}" class="mt-6 space-y-4">
    {{if .SelectedJob}}<input type="hidden" name="id" value="{{.SelectedJob.ID}}">{{end}}
    <div>
      <label for="name" class="block text-sm font-semibold text-slate-700">Name</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="name" id="name" value="{{if .SelectedJob}}{{.SelectedJob.Name}}{{end}}" required>
    </div>
    <div>
      <label for="target" class="block text-sm font-semibold text-slate-700">Target (host or group)</label>
      <select class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" name="target" id="target" required>
        <option value="">Select target</option>
        <optgroup label="Hosts">
          {{range .Hosts}}
          <option value="host:{{.ID}}" {{if eq $.SelectedTarget (printf "host:%d" .ID)}}selected{{end}}>{{.Name}}</option>
          {{end}}
        </optgroup>
        <optgroup label="Groups">
          {{range .Groups}}
          <option value="group:{{.ID}}" {{if eq $.SelectedTarget (printf "group:%d" .ID)}}selected{{end}}>{{.Name}}</option>
          {{end}}
        </optgroup>
      </select>
    </div>
    <div>
      <label for="schedule" class="block text-sm font-semibold text-slate-700">Cron Schedule</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="schedule" id="schedule" value="{{if .SelectedJob}}{{.SelectedJob.Schedule}}{{end}}" placeholder="*/5 * * * *" required>
      <p class="mt-2 text-xs text-slate-500">Five-field cron format: minute hour day month weekday.</p>
    </div>
    <div>
      <label for="schedule_hint" class="block text-sm font-semibold text-slate-700">Schedule Hint (AI helper)</label>
      <div class="mt-2 flex gap-2">
        <input class="w-full flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" type="text" name="schedule_hint" id="schedule_hint" placeholder="every 5 minutes, weekdays at 02:30" value="{{.ScheduleHint}}">
        <button type="submit" class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" formaction="/jobs/suggest" formnovalidate>Parse</button>
      </div>
      <p class="mt-2 text-xs text-slate-500">Simple parser for common phrases.</p>
    </div>
    <div>
      <label for="command" class="block text-sm font-semibold text-slate-700">Command</label>
      <textarea class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-mono text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" name="command" id="command" required>{{if .SelectedJob}}{{.SelectedJob.Command}}{{end}}</textarea>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="enabled" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" {{if .SelectedJob}}{{if .SelectedJob.Enabled}}checked{{end}}{{else}}checked{{end}}>
      <label class="text-sm font-semibold text-slate-700">Enabled</label>
    </div>
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">Save</button>
      <a class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" href="/jobs">Cancel</a>
    </div>
  </form>
</div>
{{end}}
