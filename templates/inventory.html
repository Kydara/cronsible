{{define "inventory"}}
<div class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/80">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-semibold">Inventory</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">Ansible compatible hosts file.</p>
    </div>
    <div class="flex items-center gap-2">
      <form method="post" action="/inventory/generate">
        <button type="submit" class="inline-flex items-center rounded-lg border border-emerald-600 bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:border-emerald-700 hover:bg-emerald-700 dark:border-emerald-500 dark:bg-emerald-500 dark:text-slate-900 dark:hover:border-emerald-400 dark:hover:bg-emerald-400">Generate</button>
      </form>
      <form method="get" action="/inventory/download">
        <button type="submit" class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">Download</button>
      </form>
    </div>
  </div>
  <p class="mt-4 text-sm text-slate-600 dark:text-slate-300">Inventory path: <span class="font-mono text-xs text-slate-700 dark:text-slate-200">{{.InventoryPath}}</span></p>
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Inventory is regenerated before each job run.</p>
  {{if .InventoryContent}}
  <pre class="mt-5 max-h-96 overflow-auto rounded-lg bg-slate-900 p-4 font-mono text-xs text-emerald-100 dark:bg-slate-950">{{.InventoryContent}}</pre>
  {{else}}
  <p class="mt-5 text-sm text-slate-500 dark:text-slate-400">No inventory generated yet.</p>
  {{end}}
</div>
{{end}}
