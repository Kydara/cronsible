{{define "login"}}
<div class="mx-auto mt-16 rounded-3xl border border-slate-200 bg-white/90 p-8 shadow-lg dark:border-slate-800 dark:bg-slate-900/80">
  <h2 class="text-2xl font-semibold">Admin Login</h2>
  <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Sign in to manage hosts and jobs</p>
  <form method="post" action="/login" class="mt-6 space-y-4">
    <div>
      <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Username</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-500/30" type="text" name="username" id="username" required>
    </div>
    <div>
      <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Password</label>
      <input class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-500/30" type="password" name="password" id="password" required>
    </div>
    <div class="flex items-center justify-between">
      <button type="submit" class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">Login</button>
    </div>
  </form>
</div>
{{end}}
