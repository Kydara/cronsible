{{define "runs"}}
<div class="card">
  <h2>Recent Runs</h2>
  {{if .Runs}}
  <table>
    <thead>
      <tr>
        <th>Job</th>
        <th>Started</th>
        <th>Finished</th>
        <th>Status</th>
        <th>Exit</th>
        <th>Output</th>
      </tr>
    </thead>
    <tbody>
      {{range .Runs}}
      <tr>
        <td>{{.JobName}}</td>
        <td>{{formatTime .StartedAt}}</td>
        <td>{{formatTime .FinishedAt}}</td>
        <td>{{if eq .Status "success"}}<span class="pill good">success</span>{{else}}<span class="pill bad">failed</span>{{end}}</td>
        <td>{{.ExitCode}}</td>
        <td><pre>{{.Output}}</pre></td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <p class="muted">No runs yet.</p>
  {{end}}
</div>
{{end}}
