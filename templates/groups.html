{{define "groups"}}
<div class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/80">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-semibold">Groups</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">Organize hosts into reusable targets.</p>
    </div>
    <a class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 dark:bg-emerald-500 dark:text-slate-900 dark:hover:bg-emerald-400" href="/groups/new">Add Group</a>
  </div>
  {{if .Groups}}
  <div class="mt-6 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">
        <tr>
          <th class="px-3 py-2 text-left">Name</th>
          <th class="px-3 py-2 text-left">Description</th>
          <th class="px-3 py-2 text-left">Hosts</th>
          <th class="px-3 py-2 text-left">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
        {{range .Groups}}
        <tr>
          <td class="px-3 py-3 font-semibold">{{.Name}}</td>
          <td class="px-3 py-3">{{if .Description}}{{.Description}}{{else}}<span class="text-slate-400 dark:text-slate-500">-</span>{{end}}</td>
          <td class="px-3 py-3">{{.HostCount}}</td>
          <td class="px-3 py-3">
            <div class="flex flex-wrap gap-2">
              <a class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-3 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800" href="/groups/edit?id={{.ID}}">Edit</a>
              <form method="post" action="/groups/delete">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit" class="inline-flex items-center rounded-lg bg-rose-600 px-3 py-1 text-xs font-semibold text-white shadow-sm hover:bg-rose-700 dark:bg-rose-500 dark:text-slate-900 dark:hover:bg-rose-400">Delete</button>
              </form>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
  {{else}}
    <p class="mt-6 text-sm text-slate-500 dark:text-slate-400">No groups yet.</p>
  {{end}}
</div>
{{end}}
