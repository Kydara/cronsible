{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - Cronsible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui'],
              mono: ['Space Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f6f1e9] via-[#f1f6f2] to-[#e6eef2] text-slate-900">
  {{if not .HideNav}}
  <header class="border-b border-slate-200/80 bg-white/80 backdrop-blur">
    <div class="mx-auto flex flex-col gap-3 px-5 py-4 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-700 text-white shadow">C</div>
        <div>
          <div class="text-sm uppercase tracking-[0.2em] text-emerald-700">Cronsible</div>
          <div class="text-xs text-slate-500">Agentless distributed cron</div>
        </div>
      </div>
      <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
        <a class="{{if isActive "/jobs" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/jobs">Jobs</a>
        <a class="{{if isActive "/hosts" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/hosts">Hosts</a>
        <a class="{{if isActive "/groups" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/groups">Groups</a>
        <a class="{{if isActive "/keys" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/keys">Keys</a>
        <a class="{{if isActive "/inventory" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/inventory">Inventory</a>
        <a class="{{if isActive "/runs" .CurrentPath}}rounded-full bg-emerald-600 px-3 py-1 text-white shadow-sm{{else}}rounded-full px-3 py-1 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700{{end}}" href="/runs">Runs</a>
        {{if .User}}
        <form action="/logout" method="post" class="ml-2">
          <button type="submit" class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-1 text-xs font-semibold uppercase tracking-wide text-slate-700 shadow-sm hover:bg-slate-100">Logout</button>
        </form>
        {{end}}
      </nav>
    </div>
  </header>
  {{end}}
  <main class="mx-auto max-w-6xl px-5 py-8">
    {{if .Error}}
      <div class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-5 py-3 text-sm font-semibold text-rose-800">
        {{.Error}}
      </div>
    {{end}}
    {{if .Info}}
      <div class="mb-6 rounded-2xl border-l-4 border-emerald-500 bg-white/80 px-5 py-3 text-sm text-emerald-800 shadow-sm">
        {{.Info}}
      </div>
    {{end}}
    {{render .ContentTemplate .}}
  </main>
  <script>
    document.addEventListener('click', function (event) {
      var copyButton = event.target.closest('[data-copy-target]');
      if (copyButton) {
        var selector = copyButton.getAttribute('data-copy-target');
        var target = document.querySelector(selector);
        if (!target) return;
        var text = target.textContent.trim();
        var original = copyButton.getAttribute('data-copy-label') || copyButton.textContent;

        function setCopied() {
          copyButton.textContent = 'Copied';
          setTimeout(function () {
            copyButton.textContent = original;
          }, 1200);
        }

        function fallbackCopy() {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.top = '-1000px';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            setCopied();
          } catch (err) {
          }
          document.body.removeChild(textarea);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(setCopied).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
        return;
      }

      var openButton = event.target.closest('[data-modal-open]');
      if (openButton) {
        var modalId = openButton.getAttribute('data-modal-open');
        var modal = document.getElementById(modalId);
        if (modal) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        }
        return;
      }

      var closeButton = event.target.closest('[data-modal-close]');
      if (closeButton) {
        var modal = closeButton.closest('[data-modal]');
        if (modal) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
        return;
      }

      var overlay = event.target.closest('[data-modal-overlay]');
      if (overlay && event.target === overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    });
  </script>
</body>
</html>
{{end}}
